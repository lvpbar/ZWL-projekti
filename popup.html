<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    .google-image-btn {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      width: 85%;
      margin: 1cm auto 0;
      display: block;
    }

    .google-image-btn img {
      width: 100%;
      display: block;
    }

    .google-auth-section { text-align: center; margin-bottom: 18px; }
    .account-helper { margin-top: 8px; font-size: 12px; }
    .account-helper a { color: #1a73e8; text-decoration: none; }
    .account-helper a:hover { text-decoration: underline; }

    input[type="file"] { display: none; }

    .subject-box { text-align: center; margin-bottom: 16px; }
    .subject-box h1 { font-size: 14px; margin-bottom: 6px; }
    .subject-box input {
      width: 100%; padding: 8px 10px; font-size: 14px;
      border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;
    }
    .subject-box small { display: block; font-size: 11px; color: #666; margin-top: 4px; }

    .inline-actions { display: flex; gap: 8px; }
    .inline-actions .btn { flex: 1; }

    /* disable hover move effects */
    .btn { transform: none !important; }
  </style>
</head>

<body>
  <div class="popup-container">
    <div class="popup-card">

      <!-- GOOGLE AUTH -->
      <div class="google-auth-section">
        <button id="googleAuthBtn" class="google-image-btn">
          <img src="icons/web_neutral_sq_ctn@4x.png" alt="Continue with Google"/>
        </button>
        <div class="account-helper">
          Need another account?
          <a href="https://accounts.google.com/AccountChooser" target="_blank">Change Google account</a>
        </div>
      </div>

      <!-- FILE INPUTS -->
      <input type="file" id="csvInput" accept=".csv" />
      <input type="file" id="htmlInput" accept=".html,.htm" />

      <!-- EMAIL SUBJECT -->
      <div class="subject-box">
        <h1>Email topic</h1>
        <input id="subjectInput" type="text" placeholder="Enter email subject" />
        <small>This text will be used as the email subject</small>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="button-group">

        <button id="editTemplateBtn" class="btn primary">✏️ Select HTML Template</button>
        <button id="editCsvBtn" class="btn primary">🧾 Select CSV</button>

        <div class="inline-actions">
          <button id="previewBtn" class="btn secondary">👁 Preview</button>
          <button id="sendTestBtn" class="btn secondary">✉️ Send Test Email</button>
        </div>

        <button id="sendEmailsBtn" class="btn accent">🚀 Send Emails</button>
      </div>

      <!-- STATUS -->
      <div id="statusArea" class="status-box">
        <p id="statusMessage">Not connected</p>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
