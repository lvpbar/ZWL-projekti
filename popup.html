<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Google image button */
    .google-image-btn {
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      width: 100%;
    }

    .google-image-btn img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Spacing block under Google button */
    .google-auth-section {
      margin-bottom: 18px; /* 👈 BIGGER spacing */
      text-align: center;
    }

    /* Change account helper */
    .account-helper {
      margin-top: 8px;
      font-size: 12px;
    }

    .account-helper a {
      color: #1a73e8;
      text-decoration: none;
      cursor: pointer;
    }

    .account-helper a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="popup-container">
    <div class="popup-card">


      <!-- GOOGLE AUTH SECTION -->
      <div class="google-auth-section">
        <!-- Continue with Google = REAL BUTTON -->
        <button
          id="googleAuthBtn"
          class="google-image-btn"
          aria-label="Connect Google account"
        >
          <img
            src="icons/web_neutral_sq_ctn@4x.png"
            alt="Continue with Google"
          />
        </button>

        <!-- Change account (ALWAYS visible) -->
        <div class="account-helper">
          Need another account?
          <a
            href="https://accounts.google.com/AccountChooser"
            target="_blank"
            rel="noopener noreferrer"
          >
            Change Google account
          </a>
        </div>
      </div>

      <!-- MAIN ACTION BUTTONS -->
      <div class="button-group button-panel">

        <!-- Edit HTML Template (Orange secondary) -->
        <button id="editTemplateBtn" class="btn primary">
          <span aria-hidden="true">✏️</span>
          <span>Edit HTML Template</span>
        </button>

        <!-- Edit CSV (Purple secondary) -->
        <button id="editCsvBtn" class="btn secondary">
          <span aria-hidden="true">🧾</span>
          <span>Edit CSV</span>
        </button>

        <!-- Send Emails (Primary green) -->
        <button id="sendEmailsBtn" class="btn accent">
          <span aria-hidden="true">🚀</span>
          <span>Send Emails</span>
        </button>
      </div>

      <!-- STATUS -->
      <div id="statusArea" class="status-box">
        <p id="statusMessage">Not connected</p>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
